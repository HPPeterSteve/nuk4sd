[package]
name = "Nuk4sd"
version = "0.9.30"
edition = "2021"
build = "build.rs"
description = "Linux process isolation sandbox and encrypted vault management tool"
license = "MPL-2.0"
authors = ["Pedro"]


[[bin]]
name = "Nuk4sd"
path = "rust/main.rs"


[dependencies]

# CLI / Interação
colored = "3.1.1"
inquire = "0.9.4"
rustyline = "17.0.2"
# System & FS
sysinfo = "0.38.4"
home = "0.5.12"
chrono = "0.4"
ctrlc = "3.5.2"
libc = "0.2"

# Crypto
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"

# Utilitários
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking & Async (Image Puller)
reqwest = { version = "0.11", features = ["json", "blocking"] }
tar = "0.4.40"
flate2 = "1.0.28"
tokio = { version = "1.36", features = ["full"] }
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
cgroups-rs = "0.5.1"
oci-spec = "0.10.0"

[build-dependencies]
cc = "1.1"

[package.metadata.bundle]

[package.metadata.deb]
name = "nuk4sd"
maintainer = "Pedro <pedro@local>"
copyright = "2026 Pedro"
license-file = ["LICENSE", "4"]
extended-description = """\
Nuk4sd is an advanced Linux security sandbox, vault, and container runtime \
featuring 5-layer isolation (userns, landlock, seccomp, overlayfs, pivot_root) \
and bundled with an Ubuntu 24.04 LTS SquashFS rootfs runtime.
"""
depends = "libc6 (>= 2.34), squashfs-tools, libfuse3-3, libssl3, libseccomp2, libcap2, libargon2-1"
section = "utils"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/Nuk4sd", "usr/bin/nuk4sd", "755"],
    ["runtime/ubuntu24_04.squashfs", "usr/share/nuk4sd/runtime/ubuntu24_04.squashfs", "644"],
    ["assets/nuk4sd.desktop", "usr/share/applications/nuk4sd.desktop", "644"],
    ["README.md", "usr/share/doc/nuk4sd/README.md", "644"],
]


[profile.release]
opt-level        = "z"          # Otimiza tamanho máximo (menor que "s")
lto              = "fat"        # LTO completo entre todas as crates
codegen-units    = 1            # Compila tudo em um único bloco (melhor LTO)
panic            = "abort"      # Remove stack unwinding (reduz ~20KB)
strip            = "debuginfo"  # Remove debuginfo e símbolos
debug            = false        # Sem informações de debug
overflow-checks  = false        # Remove checks de overflow
rpath            = false        # Sem RPATH embutido
incremental      = false        # Sem cache incremental (menor artefato final)

