[package]
name = "Nuk4sd"
version = "0.9.30"
edition = "2021"
build = "build.rs"

[[bin]]
name = "Nuk4sd"
path = "rust/main.rs"


[dependencies]

# CLI / Interação
colored = "3.1.1"
inquire = "0.9.4"
rustyline = "17.0.2"
# System & FS
sysinfo = "0.38.4"
home = "0.5.12"
chrono = "0.4"
ctrlc = "3.5.2"
libc = "0.2"

# Crypto
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"

# Utilitários
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking & Async (Image Puller)
reqwest = { version = "0.11", features = ["json", "blocking"] }
tar = "0.4.40"
flate2 = "1.0.28"
tokio = { version = "1.36", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
cgroups-rs = "0.5.1"
oci-spec = "0.10.0"

[build-dependencies]
cc = "1.1"

[package.metadata.bundle]

[profile.release]
opt-level        = "z"          # Otimiza tamanho máximo (menor que "s")
lto              = "fat"        # LTO completo entre todas as crates
codegen-units    = 1            # Compila tudo em um único bloco (melhor LTO)
panic            = "abort"      # Remove stack unwinding (reduz ~20KB)
strip            = "debuginfo"  # Remove debuginfo e símbolos
debug            = false        # Sem informações de debug
overflow-checks  = false        # Remove checks de overflow
rpath            = false        # Sem RPATH embutido
incremental      = false        # Sem cache incremental (menor artefato final)

